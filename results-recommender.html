<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Specialty Match — IMG Navigator</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/results.css">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a class="nav-logo" href="index.html">IMG Navigator</a>
    <ul class="nav-links">
      <li><a href="recommender.html">Specialty Finder</a></li>
      <li><a href="predictor.html">Match Predictor</a></li>
    </ul>
  </div>
</nav>

<main class="results-page">
  <div class="container">
    <div id="results-content">
      <p style="text-align:center;padding:40px;color:var(--color-muted)">Loading your results…</p>
    </div>
  </div>
</main>

<script src="js/shared.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const data = loadSession('recommender-result');
  if (!data) { window.location.href = 'recommender.html'; return; }

  const { topSpecialties, primary, answers } = data;

  const runners = topSpecialties.slice(1, 3);

  const runnerHtml = runners.map((r, i) => `
    <div class="runner-up-card">
      <div class="ru-rank">#${i + 2} Match</div>
      <h3>${r.specialty}</h3>
      <div class="score-bar-wrap">
        <div class="score-bar-track">
          <div class="score-bar-fill" style="width:0%" data-width="${r.score}%"></div>
        </div>
        <span class="label-sm" style="margin-top:4px;display:block">${r.score}% fit</span>
      </div>
    </div>
  `).join('');

  const answerRows = Object.entries(answers).map(([, val]) => `
    <tr><td>Your answer</td><td>${val}</td></tr>
  `).join('');

  const primaryScore = topSpecialties[0] ? topSpecialties[0].score : 90;

  document.getElementById('results-content').innerHTML = `

    <div class="result-primary">
      <div class="result-eyebrow">Your Top Specialty Match</div>
      <h1>${primary.specialty}</h1>

      <div class="result-stats">
        <div class="result-stat">
          <div class="stat-val">${primaryScore}%</div>
          <div class="stat-lbl">Fit Score</div>
        </div>
        <div class="result-stat">
          <div class="stat-val">${primary.imgMatchRate}</div>
          <div class="stat-lbl">IMG Match Rate</div>
        </div>
        <div class="result-stat">
          <div class="stat-val">${primary.avgStep2}</div>
          <div class="stat-lbl">Avg Step 2 (IMG)</div>
        </div>
      </div>

      <p class="result-explanation">${primary.explanation}</p>
    </div>

    ${runners.length > 0 ? `
    <h2 style="margin-bottom:12px;font-size:1rem;color:var(--color-muted)">Runner-Up Matches</h2>
    <div class="runner-ups">${runnerHtml}</div>
    ` : ''}

    ${answerRows ? `
    <div class="answer-echo">
      <h2>Your Responses</h2>
      <table class="answer-table"><tbody>${answerRows}</tbody></table>
    </div>
    ` : ''}

    <div style="margin-bottom:28px">
      <div class="result-ctas">
        <a href="predictor.html?specialty=${encodeURIComponent(primary.specialty)}" class="btn btn-primary">
          Predict Match Odds for ${primary.specialty}
        </a>
        <a href="recommender.html" class="btn btn-outline">Retake Quiz</a>
      </div>
    </div>

    <p class="disclaimer-note" style="font-size:0.78rem;color:var(--color-muted);line-height:1.5">
      Specialty recommendations are based on self-reported priorities and do not constitute professional career advice. Match rate data sourced from published NRMP statistics.
    </p>
  `;

  requestAnimationFrame(() => {
    document.querySelectorAll('.score-bar-fill').forEach(el => {
      el.style.width = el.dataset.width;
    });
  });
});
</script>
</body>
</html>
